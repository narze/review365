name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GITHUB_USER: narze
  BOARD_FILE: /tmp/e2e-board.json
  BOARD_CONFIG_FILE: /tmp/e2e-config.json

jobs:
  check:
    name: Lint & Typecheck & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - run: bun install

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run check-types

      - name: Unit tests
        run: bun test --cwd packages/api

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - run: bun install

      - name: Install Playwright browsers
        working-directory: apps/web
        run: bun playwright install chromium

      - name: E2E tests
        working-directory: apps/web
        run: bun run test:e2e
